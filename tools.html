{% extends "base.html" %}{% block title %}Tools{% endblock %}{% block content %}<section class="head"><h1>{{user.plan}} tools</h1><p>Upgrade to unlock more.</p></section><section class="tools">{% for name,r,d in tools %}<article class="{% if level<r %}locked{% endif %}"><h3>{% if level>=r %}✓{% else %}🔒{% endif %} {{name}}</h3><p>{{d}}</p>{% if level>=r %}<span>Available</span>{% else %}<a href="{{url_for('pricing')}}">Upgrade →</a>{% endif %}</article>{% endfor %}</section>{% endblock %}
