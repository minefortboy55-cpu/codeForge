<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}CodeForge{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header class="nav"><a class="brand" href="{{url_for('home')}}">Code<span>Forge</span></a><nav><a href="{{url_for('pricing')}}">Plans</a>{% if current_user %}<a href="{{url_for('tools')}}">Tools</a><a href="{{url_for('dashboard')}}">Dashboard</a><a href="{{url_for('logout')}}">Log out</a>{% else %}<a href="{{url_for('login')}}">Log in</a><a href="{{url_for('signup')}}">Sign up</a>{% endif %}</nav></header>{% with ms=get_flashed_messages() %}{% for m in ms %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}<main>{% block content %}{% endblock %}</main><footer>CodeForge · Python + Flask</footer></body></html>
